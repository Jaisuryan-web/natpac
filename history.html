<!DOCTYPE html>
<html>
<head>
<title>NATPAC Smart Travel Tracker - History</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{ background:#0f2027; color:white; font-family:Arial; text-align:center; }
.container{ width:95%; max-width:1100px; margin:20px auto; }
.card{ background:white; color:black; border-radius:14px; padding:18px; }
#map{ height: 420px; border-radius:12px; box-shadow: 0 10px 25px rgba(0,0,0,0.35); }
</style>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Leaflet CSS/JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body onload="init()">
<header class="w-full bg-gradient-to-r from-indigo-500/20 via-fuchsia-500/20 to-rose-500/20 py-6 shadow-inner">
  <h2 class="text-3xl md:text-4xl font-bold tracking-tight">📜 Trip History</h2>
  <p class="mt-2 text-white/80">Browse saved trips on map and list. Clear when needed.</p>
  <a href="/start" class="inline-block mt-3 text-sm underline text-white/90">← Back to Start</a>
</header>

<div class="container">
  <div class="grid md:grid-cols-2 gap-5">
    <div class="card">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <h3 class="text-lg font-semibold">Saved Trips</h3>
        <div class="flex items-center gap-2 text-sm">
          <label class="text-gray-600">From</label>
          <input id="startDate" type="date" class="px-2 py-1 rounded border border-gray-300"/>
          <label class="text-gray-600">To</label>
          <input id="endDate" type="date" class="px-2 py-1 rounded border border-gray-300"/>
          <button class="px-3 py-2 rounded bg-emerald-600 text-white hover:brightness-110" onclick="loadTrips()">Apply</button>
          <button class="px-3 py-2 rounded bg-gray-600 text-white hover:brightness-110" onclick="resetFilters()">Reset</button>
          <button class="px-3 py-2 rounded bg-rose-600 text-white hover:brightness-110" onclick="clearHistory()">Clear History</button>
        </div>
      </div>
      <div id="count" class="text-sm text-gray-600 mt-1"></div>
      <div id="list" class="mt-3 max-h-[420px] overflow-auto space-y-2"></div>
    </div>
    <div class="card">
      <div id="map"></div>
      <div class="text-sm text-gray-600 mt-2">Markers show saved trip locations.</div>
    </div>
  </div>
</div>

<script>
let map, savedLayer;
let currentFilters = {start_date: '', end_date: ''};

function init(){
  map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(map);
  savedLayer = L.layerGroup().addTo(map);
  map.setView([10,76], 6);
  setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} }, 300);
  loadTrips();
}

function clearList(){
  document.getElementById('list').innerHTML = '';
  document.getElementById('count').innerText = '';
}

function renderList(trips){
  const list = document.getElementById('list');
  clearList();
  document.getElementById('count').innerText = `${trips.length} trips`;
  trips.forEach(t=>{
    const item = document.createElement('div');
    item.className = 'p-3 rounded-lg bg-gray-100 text-gray-900 flex items-center justify-between';
    item.innerHTML = `
      <div>
        <div class="text-sm text-gray-500">Lat: ${Number(t.latitude).toFixed(5)}, Lon: ${Number(t.longitude).toFixed(5)}</div>
        <div class="text-sm">Mode: <b>${t.mode||'-'}</b> • Purpose: ${t.purpose||'-'} • ₹${t.cost||0}</div>
      </div>
      <button class="text-emerald-700 underline text-sm" onclick="flyTo(${t.latitude}, ${t.longitude})">View</button>
    `;
    list.appendChild(item);
  });
}

function flyTo(lat, lon){
  try{ map.setView([lat,lon], 16); }catch(e){}
}

function loadTrips(){
  const qs = buildQS();
  fetch('/trips'+qs).then(r=>r.json()).then(rows=>{
    renderList(rows);
  });
  fetch('/trips_geo'+qs).then(r=>r.json()).then(geo=>{
    savedLayer.clearLayers();
    const layer = L.geoJSON(geo, {
      pointToLayer: (f, latlng)=> L.circleMarker(latlng, {radius:7,color:'#111827',weight:1,fillColor:'#10b981',fillOpacity:.9}),
      onEachFeature: (f, layer)=>{
        const p = f.properties||{}; layer.bindPopup(`Mode: <b>${p.mode||'-'}</b><br>Purpose: ${p.purpose||'-'}<br>Cost: ₹${p.cost||0}`);
      }
    });
    savedLayer.addLayer(layer);
    try{ map.fitBounds(layer.getBounds(), {padding:[20,20]}); }catch(e){}
  });
}

function buildQS(){
  const s = document.getElementById('startDate').value;
  const e = document.getElementById('endDate').value;
  currentFilters.start_date = s || '';
  currentFilters.end_date = e || '';
  const params = new URLSearchParams();
  if(currentFilters.start_date) params.set('start_date', currentFilters.start_date);
  if(currentFilters.end_date) params.set('end_date', currentFilters.end_date);
  const qs = params.toString();
  return qs ? ('?'+qs) : '';
}

function resetFilters(){
  document.getElementById('startDate').value = '';
  document.getElementById('endDate').value = '';
  loadTrips();
}

function clearHistory(){
  if(!confirm('Clear all trips? This cannot be undone.')) return;
  fetch('/trips', {method:'DELETE'}).then(r=>r.json()).then(()=>{
    loadTrips();
  });
}
</script>
</body>
</html>
